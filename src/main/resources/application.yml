spring:
  application:
    name: qa-planning-assistant
  datasource:
    # Append prepareThreshold=0 to disable server-side prepared statements.
    # This is required when using Supabase/PgBouncer in transaction pooling mode,
    # as prepared statements are connection-scoped and cause conflicts across pool reuse.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.ascidgwzfjcwcmzkuxam.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:YOUR_SUPABASE_PASSWORD_HERE}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep the pool small to avoid overwhelming Supabase's connection limit
      maximum-pool-size: 5
      minimum-idle: 2
      # Validate connections before handing them out to detect stale/broken ones
      connection-test-query: SELECT 1
      connection-timeout: 20000
      # Recycle connections after 10 minutes to prevent PgBouncer stale state
      max-lifetime: 600000
      idle-timeout: 300000
      keepalive-time: 60000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    openai:
      api-key: ${GROQ_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:YOUR_GROQ_API_KEY_HERE}}}
      base-url: ${AI_BASE_URL:https://api.groq.com/openai/}
      chat:
        options:
          model: ${AI_MODEL:llama-3.3-70b-versatile}
          temperature: 0.3

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://agentic-qa-planner-frontend.vercel.app,https://agenticqa.barathraj.in}
  knowledge-base:
    path: classpath:knowledge-base/
  rag:
    top-k: 5

